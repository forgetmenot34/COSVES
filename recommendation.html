<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recommendation</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <nav>
        <h2>Storage Recommendation System</h2>
    </nav>

    <div class="container">

        <div class="section">

            <h2>Organization Requirements</h2>

            <label>Privacy Priority</label>
            <select id="privacy">
                <option value="1">Low</option>
                <option value="2">Medium</option>
                <option value="3">High</option>
            </select>

            <label>Accessibility Requirement</label>
            <select id="accessibility">
                <option value="1">Low</option>
                <option value="2">Medium</option>
                <option value="3">High</option>
            </select>

            <label>Security Priority</label>
            <select id="security">
                <option value="1">Low</option>
                <option value="2">Medium</option>
                <option value="3">High</option>
            </select>

            <label>Scalability Requirement</label>
            <select id="scalability">
                <option value="1">Low</option>
                <option value="2">Medium</option>
                <option value="3">High</option>
            </select>

            <button onclick="generateRecommendation()" class="btn">
                Generate Recommendation
            </button>

        </div>

        <div class="recommendation-box">

            <h1>Recommended Storage</h1>

            <h2 id="result">
                ---
            </h2>

            <p id="reason">
                Waiting for evaluation...
            </p>

        </div>

    </div>

    <script src="js/recommendation.js"></script>

</body>
</html>
